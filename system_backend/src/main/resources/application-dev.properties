# 开发环境配置
# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/student_manager_system?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# JPA配置：自动创建/更新表结构
spring.jpa.hibernate.ddl-auto=update
# 延迟数据源初始化，确保data.sql在表创建后执行
spring.jpa.defer-datasource-initialization=true


# 开发环境日志配置
logging.level.root=INFO
logging.level.com.example.system_backend=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
# SpringDoc OpenAPI日志
logging.level.org.springdoc=DEBUG
logging.level.org.springdoc.api-docs=DEBUG
logging.level.org.springdoc.webmvc=DEBUG
# SQL初始化日志
logging.level.org.springframework.boot.sql.init=DEBUG


# SQL脚本自动执行配置
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# 控制台日志格式
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n