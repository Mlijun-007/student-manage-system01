# 开发环境配置

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:student_management
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# H2 Console Configuration
# spring.h2.console.enabled和spring.h2.console.path属性在Spring Boot 2.7+中已被移除

# 开发环境日志配置
logging.level.root=INFO
logging.level.com.example.system_backend=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
# SpringDoc OpenAPI日志
logging.level.org.springdoc=DEBUG
logging.level.org.springdoc.api-docs=DEBUG
logging.level.org.springdoc.webmvc=DEBUG

# 控制台日志格式
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
